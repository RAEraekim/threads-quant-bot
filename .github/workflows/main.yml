name: Threads Quant Signal Auto Bot

on:
  # 1. 파일 푸시 즉시 최초 1회 강제 실행
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'threads_bot.js'
      - 'package.json'

  # 2. 버튼 누르면 조건 없이 즉시 실행
  workflow_dispatch:

  # 3. 이후 정해진 시간에 자동 실행
  schedule:
    # 프리마켓 점검: 월~금 22:00 KST (UTC 13:00)
    - cron: '0 13 * * 1-5'
    # 마감 브리핑: 화~토 05:30/06:30 KST (UTC 20:30 월~금)
    - cron: '30 20 * * 1-5'

jobs:
  publish-threads:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 의존성 패키지 설치
        run: npm ci || npm install

      - name: 퀀트 봇 즉시 실행 및 포스팅
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: node threads_bot.js
