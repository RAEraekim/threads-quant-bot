name: Threads Quant Signal Auto Bot

on:
  # 1. 깃허브에 코드를 올리거나 커밋(Push)하면 즉시 현재 시황 바탕으로 1회 자동 발행!
  push:
    branches:
      - main
      - master

  # 2. 정기 자동 스케줄 (한국시간 기준 월~토 자동 실행)
  schedule:
    # 🌙 [미장 개장 전 프리마켓 점검]: 월~금 한국시간 22:00 (UTC 13:00)
    - cron: '0 13 * * 1-5'
    # ☀️ [미장 정규장 마감 브리핑]: 화~토 한국시간 06:30 (UTC 21:30 월~금)
    - cron: '30 21 * * 1-5'

  # 3. 깃허브 Actions 탭에서 'Run workflow' 버튼으로 언제든 즉시 수동 실행 가능
  workflow_dispatch:
    inputs:
      session:
        description: '실행 세션 (auto: 시간대 자동 판별, pre: 프리마켓, post: 마감 브리핑)'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'pre'
          - 'post'

jobs:
  publish-threads:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v3

      - name: Node.js 20 설치
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: 퀀트 봇 실행 및 Threads 자동 포스팅
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.session }}" = "pre" ]; then
              node threads_bot.js pre
            elif [ "${{ github.event.inputs.session }}" = "post" ]; then
              node threads_bot.js post
            else
              node threads_bot.js
            fi
          else
            node threads_bot.js
          fi
