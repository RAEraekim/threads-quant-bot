name: Threads Quant Signal Auto Bot

on:
  # 1. 깃허브에 코드를 올리거나 커밋하면 즉시 현재 시황 바탕으로 1회 자동 발행!
  push:
    branches:
      - main
      - master

  # 2. 정기 자동 스케줄 (한국시간 기준)
  schedule:
    # ☀️ [미장 정규장 마감 브리핑 & 오전 숏폼]: 화~토 한국시간 오전 07:00 (UTC 22:00 전날)
    - cron: '0 22 * * 1-5'
    # 🌙 [미장 개장 전 프리마켓 & 저녁 숏폼]: 월~금 한국시간 오후 06:00 (UTC 09:00)
    - cron: '0 9 * * 1-5'

  # 3. 깃허브 Actions 탭에서 'Run workflow' 버튼으로 언제든 즉시 수동 실행 가능
  workflow_dispatch:
    inputs:
      session:
        description: '실행 세션 (auto: 시간대 자동 판별, pre: 프리마켓, post: 마감 브리핑)'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'pre'
          - 'post'

jobs:
  publish-threads:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v3

      - name: Node.js 20 설치
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: X(트위터) 라이브러리 설치
        run: npm install twitter-api-v2 --no-save

      - name: 퀀트 봇 실행 및 Threads & X 자동 포스팅
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_REFRESH_TOKEN: ${{ secrets.X_REFRESH_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.session }}" = "pre" ]; then
              node threads_bot.js pre
            elif [ "${{ github.event.inputs.session }}" = "post" ]; then
              node threads_bot.js post
            else
              node threads_bot.js
            fi
          else
            node threads_bot.js
          fi
