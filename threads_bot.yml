name: Threads Quant Signal Auto Bot (Twice Daily)

on:
  schedule:
    # 1. 미장 개장 전 프리마켓 점검: 월~금 한국시간 22:00 (UTC 13:00)
    - cron: '0 13 * * 1-5'
    # 2. 미장 마감 후 종가 브리핑: 화~토 한국시간 06:30 (UTC 21:30 월~금)
    - cron: '30 21 * * 1-5'

  workflow_dispatch:
    inputs:
      session:
        description: '실행할 세션 선택'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'pre'
          - 'post'

jobs:
  publish-threads:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v3

      - name: Node.js 20 설치
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: 퀀트 봇 실행 및 Threads 자동 포스팅
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.session }}" = "pre" ]; then
              node threads_bot.js pre
            elif [ "${{ github.event.inputs.session }}" = "post" ]; then
              node threads_bot.js post
            else
              node threads_bot.js
            fi
          else
            node threads_bot.js
          fi
